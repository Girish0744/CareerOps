<form id="application-form">
  <fieldset>
    <legend>Are you legally authorized to work in Canada?</legend>
    <label for="authorized-yes">
      <input id="authorized-yes" name="authorized" type="radio" value="Yes" />
      Yes
    </label>
    <label for="authorized-no">
      <input id="authorized-no" name="authorized" type="radio" value="No" />
      No
    </label>
  </fieldset>

  <fieldset>
    <legend>Will you now or in the future require sponsorship?</legend>
    <label for="sponsorship-yes">
      <input id="sponsorship-yes" name="sponsorship" type="radio" value="Yes" />
      Yes
    </label>
    <label for="sponsorship-no">
      <input id="sponsorship-no" name="sponsorship" type="radio" value="No" />
      No
    </label>
  </fieldset>

  <label for="demographic">
    <input id="demographic" name="voluntary_demographic" type="checkbox" value="Yes" />
    I consent to answer voluntary demographic questions.
  </label>

  <label for="accuracy">
    <input id="accuracy" name="accuracy" type="checkbox" value="Yes" />
    I certify that the information in this application is accurate.
  </label>
</form>
