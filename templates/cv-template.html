<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Resume</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin-ext.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'DM Sans', Arial, sans-serif;
    font-size: 10.5pt;
    line-height: 1.45;
    color: #000000;
    background: #ffffff;
    width: {{PAGE_WIDTH}};
    padding: 0.5in 0.65in;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 6px;
  }

  .header-name {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-size: 22pt;
    font-weight: 700;
    color: #000000;
    letter-spacing: -0.01em;
    margin-bottom: 5px;
  }

  .contact-line {
    font-size: 10pt;
    color: #000000;
    line-height: 1.5;
  }

  .contact-line a {
    color: #000000;
    text-decoration: underline;
  }

  .bsep {
    margin: 0 5px;
    color: #000000;
  }

  /* ── DIVIDERS ── */
  .header-rule {
    border: none;
    border-top: 1.5px solid #000000;
    margin: 6px 0 7px;
  }

  .section-rule {
    border: none;
    border-top: 1px solid #000000;
    margin: 2px 0 5px;
  }

  /* ── SECTION TITLES ── */
  .section-title {
    text-align: center;
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-size: 10.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #000000;
    margin: 10px 0 1px;
  }

  /* ── SUMMARY ── */
  .summary {
    font-size: 10.5pt;
    line-height: 1.5;
    margin-bottom: 2px;
  }

  /* ── SKILLS TABLE ── */
  .skills-table {
    width: 100%;
    border-collapse: collapse;
  }
  .skills-table td {
    vertical-align: top;
    padding: 1.5px 0;
    font-size: 10.5pt;
    line-height: 1.45;
  }
  .skill-cat {
    font-weight: 700;
    width: 185pt;
    padding-right: 6pt;
    white-space: nowrap;
  }

  /* ── ENTRY (Education, Experience, Extracurricular) ── */
  .entry {
    margin-bottom: 9px;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .entry:last-child { margin-bottom: 0; }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .entry-left {
    font-size: 10.5pt;
    flex: 1;
    min-width: 0;
  }

  .entry-title {
    font-weight: 700;
  }

  .entry-right {
    font-size: 10.5pt;
    font-weight: 700;
    white-space: nowrap;
    margin-left: 10pt;
  }

  /* ── BULLET LISTS ── */
  ul {
    margin: 3px 0 0 0;
    padding-left: 18px;
  }

  li {
    font-size: 10.5pt;
    line-height: 1.45;
    margin-bottom: 2px;
  }

  li:last-child { margin-bottom: 0; }

  /* ── PROJECTS ── */
  .project {
    margin-bottom: 9px;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .project:last-child { margin-bottom: 0; }

  .project-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .project-name {
    font-size: 10.5pt;
    font-weight: 700;
    flex: 1;
  }

  .project-name a {
    color: #000000;
    text-decoration: underline;
    font-weight: 400;
  }

  .project-year {
    font-size: 10.5pt;
    font-weight: 700;
    white-space: nowrap;
    margin-left: 10pt;
  }

  /* ── PRINT ── */
  @media print {
    body { padding: 0.5in 0.65in; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-name">{{NAME}}</div>
  <div class="contact-line">
    {{LOCATION}}<span class="bsep">•</span><!--
    --><a href="mailto:{{EMAIL}}">{{EMAIL}}</a><span class="bsep">•</span><!--
    -->{{PHONE_SPAN}}<a href="https://{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a><span class="bsep">•</span><!--
    --><a href="{{PORTFOLIO_URL}}">{{PORTFOLIO_DISPLAY}}</a><span class="bsep">•</span><!--
    --><a href="https://{{GITHUB_URL}}">{{GITHUB_DISPLAY}}</a>
  </div>
</div>

<hr class="header-rule">

<!-- SUMMARY -->
<div class="summary">{{SUMMARY_TEXT}}</div>

<!-- TECHNICAL SKILLS -->
<div class="section-title">Technical Skills</div>
<hr class="section-rule">
{{SKILLS}}

<!-- EDUCATION -->
<div class="section-title">Education</div>
<hr class="section-rule">
{{EDUCATION}}

<!-- PROFESSIONAL EXPERIENCE -->
<div class="section-title">Professional Experience</div>
<hr class="section-rule">
{{EXPERIENCE}}

<!-- PROJECT EXPERIENCE -->
<div class="section-title">Project Experience</div>
<hr class="section-rule">
{{PROJECTS}}

<!-- EXTRACURRICULAR ACTIVITIES -->
<div class="section-title">Extracurricular Activities</div>
<hr class="section-rule">
{{EXTRACURRICULAR}}

</body>
</html>
