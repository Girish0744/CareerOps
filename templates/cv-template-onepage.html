<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8" />
<title>{{NAME}} — Resume</title>

<!--
  One-page resume format, modelled on the FAANGPath Overleaf template.
  Sibling of the locked two-page cv-template.html, which must not be edited.

  It styles the SAME class names document-renderer.ts already emits
  (.entry / .project / .skills-table), so a different layout needs no renderer
  change — only this file differs.

  Section order: Profile, Skills, Experience, Projects, Education, Leadership,
  Certifications. Awards are omitted on one page; Highlights fold into Profile.
-->

<style>
  @page {
    size: Letter;
    /* Matches the 0.4in geometry of the source LaTeX template. */
    margin: 0.4in 0.45in;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 9.6pt;
    line-height: 1.16;
    color: #000;
    background: #fff;
  }

  a {
    color: #000;
    text-decoration: none;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */

  .header {
    text-align: center;
    margin-bottom: 7pt;
  }

  .header-name {
    font-size: 17pt;
    font-weight: 700;
    letter-spacing: 0.4pt;
    line-height: 1.05;
    margin-bottom: 3pt;
  }

  .contact-line {
    font-size: 9.2pt;
    line-height: 1.3;
  }

  .bsep {
    margin: 0 4pt;
  }

  /* ── Section headings ───────────────────────────────────────────────── */

  .section-title {
    font-size: 10.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3pt;
    line-height: 1;
    margin-top: 7pt;
    margin-bottom: 1.5pt;
  }

  .section-title.first {
    margin-top: 0;
  }

  .section-rule {
    border: 0;
    border-top: 0.7pt solid #000;
    margin: 0 0 3.5pt 0;
  }

  .summary {
    text-align: justify;
  }

  /* ── Experience and Education entries ───────────────────────────────── */

  .entry {
    margin-bottom: 4.5pt;
  }

  .entry:last-child {
    margin-bottom: 0;
  }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8pt;
  }

  .entry-title {
    font-weight: 700;
  }

  .entry-right {
    white-space: nowrap;
  }

  .entry-company,
  .entry-note {
    font-style: italic;
  }

  /* ── Projects ────────────────────────────────────────────────────────────
     Same shape as an experience entry so the type never changes mid-page:
     line 1 is the bold name plus its underlined link, with the date pushed
     right; line 2 is the stack; then the content bullets. */

  .project {
    margin-bottom: 4.5pt;
  }

  .project:last-child {
    margin-bottom: 0;
  }

  .project-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8pt;
  }

  .project-name {
    font-weight: 700;
  }

  /* The builder wraps the project name in markdown bold, so the renderer emits
     <strong> inside this already-700 element. The UA stylesheet gives <strong>
     font-weight: bolder, which resolves to 900 against a 700 parent; Arial has
     no 900 face, so the browser synthesises one and the name renders in what
     looks like a different typeface. Inheriting pins it to the same 700 as an
     experience title. */
  .project-name strong {
    font-weight: inherit;
  }

  /* Links inside a project name are underlined so the GitHub URL reads as a
     link in print, where hover and colour are unavailable. */
  .project-name a {
    text-decoration: underline;
    /* The name is bold; the URL must not inherit that weight. */
    font-weight: 400;
  }

  .project-year {
    white-space: nowrap;
  }

  .entry ul,
  .project ul {
    margin: 1pt 0 0 12pt;
  }

  /* Uniform type: every body-level element states the same size explicitly so
     no element can drift through inheritance or a UA default. */
  .summary,
  .entry,
  .project,
  .skills-table,
  .skills-table td,
  li,
  p {
    font-size: 9.6pt;
  }

  .entry li,
  .project li {
    margin-bottom: 0.5pt;
  }

  /* ── Skills: two-column label / value table ─────────────────────────── */

  .skills-table {
    width: 100%;
    border-collapse: collapse;
  }

  .skills-table td {
    vertical-align: top;
    padding: 0 0 1pt 0;
  }

  .skills-table td:first-child {
    font-weight: 700;
    white-space: nowrap;
    padding-right: 10pt;
  }

  ul {
    margin-left: 12pt;
  }

  li {
    margin-bottom: 0.5pt;
  }

  .certifications-line {
    margin-top: 1pt;
  }

  /* An optional section whose content came back empty is removed by the
     renderer, so a bare heading with a rule under it can never render. */
</style>
</head>
<body>

<div class="header">
  <div class="header-name">{{NAME}}</div>
  <div class="contact-line">
    {{LOCATION}}<span class="bsep">●</span>{{PHONE}}<span class="bsep">●</span><a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
  </div>
  <div class="contact-line">
    <a href="https://{{LINKEDIN_DISPLAY}}">{{LINKEDIN_DISPLAY}}</a><span class="bsep">●</span>
    <a href="https://{{PORTFOLIO_DISPLAY}}">{{PORTFOLIO_DISPLAY}}</a><span class="bsep">●</span>
    <a href="https://{{GITHUB_DISPLAY}}">{{GITHUB_DISPLAY}}</a>
  </div>
</div>

<div class="section-title first">Profile</div>
<hr class="section-rule">
<div class="summary">{{SUMMARY_TEXT}}</div>

<div class="section-title">Skills</div>
<hr class="section-rule">
{{SKILLS}}

<div class="section-title">Experience</div>
<hr class="section-rule">
{{EXPERIENCE}}

<div class="section-title">Projects</div>
<hr class="section-rule">
{{PROJECTS}}

<div class="section-title">Education</div>
<hr class="section-rule">
{{EDUCATION}}

<section data-optional>
  <div class="section-title">Leadership</div>
  <hr class="section-rule">
  {{EXTRACURRICULAR}}
</section>

<section data-optional>
  <div class="section-title">Certifications</div>
  <hr class="section-rule">
  <p class="certifications-line">{{CERTIFICATIONS}}</p>
</section>

</body>
</html>
