<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Cover Letter</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin-ext.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'DM Sans', Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.55;
    color: #000000;
    background: #ffffff;
    width: {{PAGE_WIDTH}};
    padding: 0.6in 0.75in;
  }

  /* ── HEADER (matches resume exactly) ── */
  .header {
    text-align: center;
    margin-bottom: 6px;
  }

  .header-name {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-size: 22pt;
    font-weight: 700;
    color: #000000;
    letter-spacing: -0.01em;
    margin-bottom: 5px;
  }

  .contact-line {
    font-size: 10pt;
    color: #000000;
    line-height: 1.5;
  }

  .contact-line a {
    color: #000000;
    text-decoration: underline;
  }

  /* Comma separator (cover letter uses commas, matching the provided PDF) */
  .csep { margin-right: 1px; }

  /* ── HEADER RULE ── */
  .header-rule {
    border: none;
    border-top: 1.5px solid #000000;
    margin: 6px 0 18px;
  }

  /* ── LETTER BODY ── */
  .date-line {
    margin-bottom: 14px;
    font-size: 11pt;
  }

  .recipient-block {
    margin-bottom: 14px;
    font-size: 11pt;
    line-height: 1.5;
  }

  .subject-line {
    font-weight: 700;
    font-size: 11pt;
    margin-bottom: 14px;
  }

  .salutation {
    margin-bottom: 14px;
    font-size: 11pt;
  }

  .body-paragraphs p {
    font-size: 11pt;
    margin-bottom: 12px;
    line-height: 1.55;
  }

  .body-paragraphs ul {
    margin: 0 0 12px 0;
    padding-left: 20px;
  }

  .body-paragraphs li {
    font-size: 11pt;
    line-height: 1.55;
    margin-bottom: 4px;
  }

  .closing {
    margin-top: 14px;
  }

  .sign-off {
    font-size: 11pt;
    margin-bottom: 18px;
  }

  .sig-name {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-size: 11pt;
    font-weight: 700;
  }
</style>
</head>
<body>

<!-- HEADER — same layout as resume -->
<div class="header">
  <div class="header-name">{{NAME}}</div>
  <div class="contact-line">
    {{LOCATION}},
    <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>,
    {{PHONE_SPAN}}<a href="https://{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a>,
    <a href="{{PORTFOLIO_URL}}">{{PORTFOLIO_DISPLAY}}</a>,
    <a href="https://{{GITHUB_URL}}">{{GITHUB_DISPLAY}}</a>
  </div>
</div>

<hr class="header-rule">

<!-- LETTER CONTENT -->
<div class="date-line">{{DATE}}</div>

<div class="recipient-block">
  <strong>{{HIRING_MANAGER}}</strong><br>
  {{RECIPIENT_TITLE_LINE}}
  {{COMPANY}}<br>
  {{COMPANY_ADDRESS}}
</div>

<div class="subject-line">Subject: Application for {{JOB_TITLE}}{{JOB_REF}}</div>

<div class="salutation">Dear {{SALUTATION}},</div>

<div class="body-paragraphs">
{{BODY}}
</div>

<div class="closing">
  <div class="sign-off">Sincerely,</div>
  <div class="sig-name">{{NAME}}</div>
</div>

</body>
</html>
